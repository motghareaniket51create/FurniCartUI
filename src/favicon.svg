<svg width="64" height="64" viewBox="0 0 64 64" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>FurniKart</title>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#3D5A80"/>

  <!-- Chair legs -->
  <line x1="22" y1="40" x2="19" y2="52" stroke="#7FAACC" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="40" x2="45" y2="52" stroke="#7FAACC" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="41" x2="21" y2="52" stroke="#7FAACC" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="41" x2="43" y2="52" stroke="#7FAACC" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Seat -->
  <rect x="18" y="36" width="28" height="7" rx="2.5" fill="#C8956C"/>

  <!-- Left armrest -->
  <rect x="15" y="25" width="5" height="14" rx="2" fill="#B07540"/>
  <!-- Right armrest -->
  <rect x="44" y="25" width="5" height="14" rx="2" fill="#B07540"/>

  <!-- Backrest -->
  <rect x="20" y="14" width="24" height="18" rx="4" fill="#C8956C"/>
  <!-- Backrest cushion -->
  <rect x="23" y="17" width="18" height="12" rx="3" fill="#D9A87A" opacity="0.5"/>
  <!-- Top rail -->
  <rect x="20" y="11" width="24" height="6" rx="3" fill="#B07540"/>
</svg>
